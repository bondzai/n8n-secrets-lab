services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: n8n
    volumes:
      - pgdata:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    depends_on: [postgres]
    ports: ["5678:5678"]
    env_file: .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n
      N8N_SECURE_COOKIE: "false"
      # Demo QoL: silence telemetry/banners. Owner-setup is auto-seeded by
      # `make seed` after boot (the env flag for skipping it was removed in n8n 1.x).
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Default is "true" — blocks $env access in expressions/Code nodes.
      # We set false here ON PURPOSE so the leak demo works.
      # In real life, leave it true; that's defense-in-depth against
      # workflow authors exfiltrating env-stored secrets.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8ndata:/home/node/.n8n

volumes:
  pgdata:
  n8ndata:
